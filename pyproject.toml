[project]
name = "tv-history-mcp"
version = "0.1.0"
description = "Historical TradingView OHLCV storage and MCP analysis service"
requires-python = ">=3.11,<3.14"
dependencies = [
  "mcp[cli]>=1.12.0",
  "matplotlib>=3.9",
  "mplfinance>=0.12.10b0",
  "pandas>=2.2",
  "PyYAML>=6.0",
  "tvdatafeed @ git+https://github.com/rongardF/tvdatafeed.git",
]

[project.scripts]
tv-history-mcp = "tv_history.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = ["pytest>=9.0"]

[tool.uv]
package = true

[tool.pytest.ini_options]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
