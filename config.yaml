storage:
  root: data
  provider_naive_timezone: Europe/Istanbul

provider:
  initial_bars: 5000
  refresh_overlap_bars: 3
  finalization_delay_minutes: 5
  finalization_delay_by_exchange:
    ICEEUR: 25
    CME_MINI: 25
    COMEX: 25

indicators:
  sma: [20, 50, 200]
  ema: [9, 20, 50, 200]
  rsi_period: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  bollinger_period: 20
  bollinger_stddev: 2.0
  atr_period: 14
  atr_daily_band_coefficient: 0.4
  adx_period: 14
  volume_sma_period: 20
