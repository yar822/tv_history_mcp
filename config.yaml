storage:
  root: data
  provider_naive_timezone: Europe/Istanbul

market_rules:
  exchanges:
    RUS:
      timezone: Europe/Moscow
      timestamp_profile: moex_futures
      symbols:
        # Equities retain native daily/weekly labels; timezone is inherited.
        SBER: {timestamp_profile: null}
        YDEX: {timestamp_profile: null}
    COMEX:
      timezone: America/Chicago
      timestamp_profile: cme_overnight
    CME_MINI:
      timezone: America/Chicago
      timestamp_profile: cme_overnight
    ICEEUR:
      timezone: Europe/London
      timestamp_profile: ice_brent
    BITSTAMP:
      timezone: UTC
      timestamp_profile: utc_calendar

provider:
  initial_bars: 5000
  refresh_overlap_bars: 5
  finalization_delay_minutes: 5
  finalization_delay_by_exchange:
    ICEEUR: 15
    CME_MINI: 15
    COMEX: 15
  # Boundary exceptions only; ordinary latest bars always await a successor.
  finalization_delay_by_asset:
    "RUS:MX1!": 5
    "RUS:SI1!": 5
    "COMEX:GC1!": 15
    "CME_MINI:NQ1!": 15
    "ICEEUR:BRN1!": 15

calendar:
  completed_sessions: 30
  lookback_days: 90
  min_observations: 4
  min_agreement: 0.9
  # asset -> timeframe -> raw UTC opening ISO timestamp -> actual close ISO timestamp.
  # Date-specific overrides must use timezone-aware values.
  boundary_overrides: {}

indicators:
  sma: [20, 50, 200]
  ema: [9, 20, 50, 200]
  rsi_period: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  bollinger_period: 20
  bollinger_stddev: 2.0
  atr_period: 14
  atr_daily_band_coefficient: 0.4
  adx_period: 14
  volume_sma_period: 20
